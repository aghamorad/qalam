name: Test Qalam

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qalam-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qalam
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Install calibre for real MOBI testing
        run: brew install --cask calibre

      - name: Run normalization and regression tests
        run: |
          python tests/test_normalize.py
          python tests/test_structure.py
          python tests/test_fonts.py
          python tests/test_extract_guard.py
          python tests/test_semantic_epub.py
          python tests/test_spacing.py

      - name: Generate a real text-based Persian PDF fixture
        run: python tests/make_fixture_pdf.py tests/qalam-smoke.pdf

      - name: Drive the real GUI through a conversion
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_gui_smoke.py tests/qalam-smoke.pdf
          test -f tests/converted/qalam-smoke.epub

      - name: Exercise CLI and --no-notes
        run: |
          python -m persian_ebook.cli tests/qalam-smoke.pdf \
            --no-notes -o tests/qalam-smoke-no-notes.epub
          python tests/test_epub_output.py tests/converted/qalam-smoke.epub
          python tests/test_epub_output.py tests/qalam-smoke-no-notes.epub --no-notes

      - name: Generate and inspect a real MOBI
        run: |
          set -euo pipefail
          python -m persian_ebook.cli tests/qalam-smoke.pdf \
            --format mobi -o tests/qalam-smoke.mobi
          test -s tests/qalam-smoke.mobi
          ebook-meta tests/qalam-smoke.mobi > /tmp/qalam-mobi-meta.txt
          cat /tmp/qalam-mobi-meta.txt
          grep -q "آزمون" /tmp/qalam-mobi-meta.txt

      - name: Exercise combined EPUB + MOBI output
        run: |
          set -euo pipefail
          rm -rf tests/converted
          python -m persian_ebook.cli tests/qalam-smoke.pdf --format both
          test -s tests/converted/qalam-smoke.epub
          test -s tests/converted/qalam-smoke.mobi
          ebook-meta tests/converted/qalam-smoke.mobi >/dev/null

      - name: Validate EPUBs with EPUBCheck 5.4.0
        run: |
          set -euo pipefail
          mkdir -p .epubcheck
          curl -fsSL             https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip             -o .epubcheck/epubcheck.zip
          ditto -x -k .epubcheck/epubcheck.zip .epubcheck/unpacked
          JAR="$(find .epubcheck/unpacked -name 'epubcheck.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" tests/converted/qalam-smoke.epub
          java -jar "$JAR" tests/qalam-smoke-no-notes.epub

      - name: Build Qalam.app
        run: python -m PyInstaller Qalam.spec --noconfirm

      - name: Check and launch the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          test -x dist/Qalam.app/Contents/MacOS/Qalam
          test -d dist/Qalam.app/Contents/Resources/persian_ebook/data/fonts
          dist/Qalam.app/Contents/MacOS/Qalam > /tmp/qalam-app.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat /tmp/qalam-app.log
            wait "$PID"
            exit 1
          fi
          kill "$PID"
          wait "$PID" || true
          echo "Qalam.app stayed alive for the smoke-launch window."
